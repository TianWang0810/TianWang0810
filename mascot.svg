<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <defs>
    <filter id="fur" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000022"/>
    </filter>
  </defs>
  <style>
    .dog  { animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0);   }
      50%       { transform: translateY(-8px); }
    }
    .eye-open   { animation: blink-o 4s ease-in-out infinite; }
    .eye-closed { animation: blink-c 4s ease-in-out infinite; opacity: 0; }
    @keyframes blink-o {
      0%, 90%, 100% { opacity: 1; }
      93%, 97%      { opacity: 0; }
    }
    @keyframes blink-c {
      0%, 90%, 100% { opacity: 0; }
      93%, 97%      { opacity: 1; }
    }
  </style>

  <g class="dog" filter="url(#fur)">

    <!-- floppy ears -->
    <ellipse cx="46"  cy="118" rx="26" ry="38" fill="#ECEAE2"/>
    <ellipse cx="154" cy="118" rx="26" ry="38" fill="#ECEAE2"/>
    <ellipse cx="46"  cy="122" rx="15" ry="25" fill="#F9D8E4" opacity="0.35"/>
    <ellipse cx="154" cy="122" rx="15" ry="25" fill="#F9D8E4" opacity="0.35"/>

    <!-- fluffy top-of-head puffs -->
    <circle cx="66"  cy="58" r="31" fill="#F9F9F5"/>
    <circle cx="100" cy="50" r="34" fill="#F9F9F5"/>
    <circle cx="134" cy="58" r="31" fill="#F9F9F5"/>

    <!-- main head -->
    <circle cx="100" cy="112" r="70" fill="#F9F9F5"/>

    <!-- fluffy cheeks -->
    <circle cx="48"  cy="122" r="28" fill="#F9F9F5"/>
    <circle cx="152" cy="122" r="28" fill="#F9F9F5"/>

    <!-- subtle blush -->
    <circle cx="70"  cy="133" r="15" fill="#FFB3B3" opacity="0.10"/>
    <circle cx="130" cy="133" r="15" fill="#FFB3B3" opacity="0.10"/>

    <!-- fur texture lines -->
    <line x1="100" y1="50" x2="100" y2="67" stroke="#E2E2DC" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <line x1="77"  y1="57" x2="81"  y2="73" stroke="#E2E2DC" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <line x1="123" y1="57" x2="119" y2="73" stroke="#E2E2DC" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- OPEN EYES -->
    <g class="eye-open">
      <circle cx="81"  cy="107" r="13" fill="#1A1A1A"/>
      <circle cx="119" cy="107" r="13" fill="#1A1A1A"/>
      <!-- shine: large -->
      <circle cx="76"  cy="102" r="5"  fill="#FFFFFF"/>
      <circle cx="114" cy="102" r="5"  fill="#FFFFFF"/>
      <!-- shine: small secondary -->
      <circle cx="87"  cy="104" r="2"  fill="#FFFFFF" opacity="0.55"/>
      <circle cx="125" cy="104" r="2"  fill="#FFFFFF" opacity="0.55"/>
    </g>

    <!-- CLOSED EYES (blink) -->
    <g class="eye-closed">
      <ellipse cx="81"  cy="109" rx="13" ry="3.5" fill="#1A1A1A"/>
      <ellipse cx="119" cy="109" rx="13" ry="3.5" fill="#1A1A1A"/>
      <!-- closed-eye lash hint -->
      <line x1="72" y1="107" x2="75" y2="104" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="90" y1="107" x2="87" y2="104" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="110" y1="107" x2="113" y2="104" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="128" y1="107" x2="125" y2="104" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- nose -->
    <ellipse cx="100" cy="129" rx="11" ry="8"   fill="#1A1A1A"/>
    <ellipse cx="97"  cy="126" rx="3.5" ry="2.5" fill="#555555"/>

    <!-- mouth + tongue -->
    <path d="M 90 138 Q 100 148 110 138" stroke="#C0C0C0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="147" rx="7" ry="5" fill="#FF9EB5"/>

  </g>
</svg>

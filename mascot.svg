<svg xmlns="http://www.w3.org/2000/svg" width="220" height="240" viewBox="0 0 220 240">
  <style>
    .dog { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .eye-open { animation: blink-o 4s ease-in-out infinite; }
    .eye-shut { animation: blink-c 4s ease-in-out infinite; opacity:0; }
    @keyframes blink-o { 0%,90%,100%{opacity:1} 93%,97%{opacity:0} }
    @keyframes blink-c { 0%,90%,100%{opacity:0} 93%,97%{opacity:1} }
    .note { animation: sway 2s ease-in-out infinite alternate; }
    @keyframes sway { from{transform:translateY(0) rotate(-5deg)} to{transform:translateY(-6px) rotate(5deg)} }
  </style>

  <!-- Music notes floating (outside dog group, no float animation) -->
  <text class="note" x="170" y="30" font-size="16" fill="#8EA8BC" opacity="0.7" style="animation-delay:0s">♩</text>
  <text class="note" x="185" y="80" font-size="16" fill="#8EA8BC" opacity="0.7" style="animation-delay:0.6s">♪</text>
  <text class="note" x="175" y="130" font-size="16" fill="#8EA8BC" opacity="0.7" style="animation-delay:1.2s">♩</text>


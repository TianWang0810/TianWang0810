<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210">
  <style>
    .dog  { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .eye-open { animation: blink-o 4s ease-in-out infinite; }
    .eye-shut { animation: blink-c 4s ease-in-out infinite; opacity:0; }
    @keyframes blink-o { 0%,90%,100%{opacity:1} 93%,97%{opacity:0} }
    @keyframes blink-c { 0%,90%,100%{opacity:0} 93%,97%{opacity:1} }
    .note { animation: sway 2.2s ease-in-out infinite alternate; transform-origin: 50% 50%; }
    @keyframes sway { from{transform:translateY(0) rotate(-8deg)} to{transform:translateY(-7px) rotate(8deg)} }
  </style>

  <!-- Music notes (independent of dog float) -->
  <text class="note" x="196" y="55"  font-size="15" font-family="'Caveat',cursive" fill="#8EA8BC" opacity="0.75" style="animation-delay:0s">♩</text>
  <text class="note" x="200" y="105" font-size="15" font-family="'Caveat',cursive" fill="#ACA0BA" opacity="0.75" style="animation-delay:0.7s">♪</text>
  <text class="note" x="196" y="155" font-size="15" font-family="'Caveat',cursive" fill="#8EA8BC" opacity="0.65" style="animation-delay:1.4s">♩</text>

  <g class="dog">
    <!-- ── BOW (centered on col 9, x=99) ── -->
    <!-- Row 0 y=10: cols 7,9,11 -->
    <rect x="77"  y="10" width="11" height="11" fill="#C09898"/>
    <rect x="99"  y="10" width="11" height="11" fill="#A87878"/>
    <rect x="121" y="10" width="11" height="11" fill="#C09898"/>
    <!-- Row 1 y=21: cols 6-8=bow, 9=center, 10-12=bow -->
    <rect x="66"  y="21" width="33" height="11" fill="#C09898"/>
    <rect x="99"  y="21" width="11" height="11" fill="#A87878"/>
    <rect x="110" y="21" width="33" height="11" fill="#C09898"/>
    <!-- Row 2 y=32: same as row 0 -->
    <rect x="77"  y="32" width="11" height="11" fill="#C09898"/>
    <rect x="99"  y="32" width="11" height="11" fill="#A87878"/>
    <rect x="121" y="32" width="11" height="11" fill="#C09898"/>

    <!-- ── HEAD FUR ── -->
    <!-- Row 3 y=43: cols 5-14 -->
    <rect x="55"  y="43" width="110" height="11" fill="#F5F2ED"/>
    <!-- Row 4 y=54: cols 4-15 -->
    <rect x="44"  y="54" width="132" height="11" fill="#F5F2ED"/>
    <!-- Row 5 y=65: cols 3-16 -->
    <rect x="33"  y="65" width="154" height="11" fill="#F5F2ED"/>
    <!-- Row 6 y=76: cols 2-17 -->
    <rect x="22"  y="76" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 7 y=87: cols 2-17 -->
    <rect x="22"  y="87" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 8 y=98: cols 2-17 (full fur, eyes overlay on top) -->
    <rect x="22"  y="98" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 9 y=109: cols 2-17 -->
    <rect x="22"  y="109" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 10 y=120: cols 2-17 -->
    <rect x="22"  y="120" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 11 y=131: muzzle (FUR + SHADOW cheeks) -->
    <rect x="22"  y="131" width="33"  height="11" fill="#F5F2ED"/>
    <rect x="55"  y="131" width="22"  height="11" fill="#DDD8D0"/>
    <rect x="77"  y="131" width="66"  height="11" fill="#F5F2ED"/>
    <rect x="143" y="131" width="22"  height="11" fill="#DDD8D0"/>
    <rect x="165" y="131" width="33"  height="11" fill="#F5F2ED"/>
    <!-- Row 12 y=142: nose (FUR + NOSE pixels) -->
    <rect x="22"  y="142" width="77"  height="11" fill="#F5F2ED"/>
    <rect x="99"  y="142" width="22"  height="11" fill="#4A3830"/>
    <rect x="121" y="142" width="77"  height="11" fill="#F5F2ED"/>
    <!-- Row 13 y=153: cols 2-17 -->
    <rect x="22"  y="153" width="176" height="11" fill="#F5F2ED"/>
    <!-- Row 14 y=164: cols 3-16 -->
    <rect x="33"  y="164" width="154" height="11" fill="#F5F2ED"/>
    <!-- Row 15 y=175: cols 4-15 -->
    <rect x="44"  y="175" width="132" height="11" fill="#F5F2ED"/>
    <!-- Row 16 y=186: cols 5-14 -->
    <rect x="55"  y="186" width="110" height="11" fill="#F5F2ED"/>

    <!-- ── EYES OPEN (col 6=x66, col 13=x143) ── -->
    <g class="eye-open">
      <rect x="66"  y="98" width="11" height="11" fill="#3C3530"/>
      <rect x="143" y="98" width="11" height="11" fill="#3C3530"/>
      <!-- eye shine top-left corner -->
      <rect x="66"  y="98" width="5"  height="4"  fill="#F9F7F4"/>
      <rect x="143" y="98" width="5"  height="4"  fill="#F9F7F4"/>
    </g>
    <!-- ── EYES SHUT (horizontal line) ── -->
    <g class="eye-shut">
      <rect x="66"  y="103" width="11" height="2" fill="#3C3530"/>
      <rect x="143" y="103" width="11" height="2" fill="#3C3530"/>
    </g>
  </g>
</svg>

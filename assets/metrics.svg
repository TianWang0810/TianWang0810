<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="118" viewBox="0 0 1000 118">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');
      .s{font-family:'Caveat',cursive}
      .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    </style>
  </defs>

  <!-- Outer card -->
  <rect width="1000" height="118" fill="#EDE8E3"/>
  <rect x="6" y="6" width="988" height="106" rx="10" fill="none" stroke="#C4BAB2" stroke-width="1.5"/>

  <!-- Card 1: dusty blue — 6 services -->
  <rect x="12" y="12" width="236" height="94" rx="8" fill="#E8E3DD" stroke="#C4BAB2" stroke-width="1"/>
  <rect x="12" y="12" width="236" height="4" rx="2" fill="#8EA8BC"/>
  <text x="130" y="58" class="s" font-size="30" font-weight="bold" fill="#4A4540" text-anchor="middle">6</text>
  <text x="130" y="88" class="s" font-size="13" fill="#7A7470" text-anchor="middle">services · distributed system</text>

  <!-- Card 2: dusty teal — RAG -->
  <rect x="258" y="12" width="236" height="94" rx="8" fill="#E8E3DD" stroke="#C4BAB2" stroke-width="1"/>
  <rect x="258" y="12" width="236" height="4" rx="2" fill="#90ABAA"/>
  <text x="376" y="58" class="s" font-size="30" font-weight="bold" fill="#4A4540" text-anchor="middle">RAG</text>
  <text x="376" y="88" class="s" font-size="13" fill="#7A7470" text-anchor="middle">hybrid BM25 + pgvector + RRF</text>

  <!-- Card 3: lavender — MSCS -->
  <rect x="504" y="12" width="236" height="94" rx="8" fill="#E8E3DD" stroke="#C4BAB2" stroke-width="1"/>
  <rect x="504" y="12" width="236" height="4" rx="2" fill="#ACA0BA"/>
  <text x="622" y="58" class="s" font-size="30" font-weight="bold" fill="#4A4540" text-anchor="middle">MSCS</text>
  <text x="622" y="88" class="s" font-size="13" fill="#7A7470" text-anchor="middle">Northeastern · Seattle</text>

  <!-- Card 4: sage — 2026 -->
  <rect x="750" y="12" width="236" height="94" rx="8" fill="#E8E3DD" stroke="#C4BAB2" stroke-width="1"/>
  <rect x="750" y="12" width="236" height="4" rx="2" fill="#8FA898"/>
  <text x="868" y="58" class="s" font-size="30" font-weight="bold" fill="#4A4540" text-anchor="middle">2026</text>
  <text x="868" y="88" class="s" font-size="13" fill="#7A7470" text-anchor="middle">summer intern · SWE / MLE</text>
</svg>

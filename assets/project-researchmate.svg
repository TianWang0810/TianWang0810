<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
  <defs>
    <style>
      .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
      .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    </style>
  </defs>

  <!-- Card background -->
  <rect width="1000" height="190" fill="#EDE8E3"/>
  <rect x="6" y="6" width="988" height="178" rx="10" fill="none" stroke="#C4BAB2" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="6" y="6" width="3" height="178" fill="#8EA8BC"/>

  <!-- Label -->
  <text x="28" y="44" class="m" font-size="10.5" fill="#7A7470" letter-spacing="1">01 / FEATURED PROJECT</text>

  <!-- Title -->
  <text x="28" y="80" class="s" font-size="22" font-weight="bold" fill="#4A4540">researchmate · Lab Experiment Tracking with LLM Agents</text>

  <!-- Description -->
  <text x="28" y="108" class="s" font-size="14" fill="#7A7470">LangChain ReAct agent with hybrid BM25 + pgvector retrieval and RRF fusion, across a 6-service</text>
  <text x="28" y="126" class="s" font-size="14" fill="#7A7470">Docker Compose stack with local LLM inference via Ollama.</text>

  <!-- Tech chips at y=148 -->
  <!-- Python -->
  <rect x="28" y="142" width="58" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="57" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">Python</text>

  <!-- LangChain -->
  <rect x="94" y="142" width="76" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="132" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">LangChain</text>

  <!-- pgvector -->
  <rect x="178" y="142" width="70" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="213" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">pgvector</text>

  <!-- Flask -->
  <rect x="256" y="142" width="52" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="282" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">Flask</text>

  <!-- Docker -->
  <rect x="316" y="142" width="58" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="345" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">Docker</text>

  <!-- Ollama -->
  <rect x="382" y="142" width="58" height="22" rx="6" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>
  <text x="411" y="157" class="m" font-size="11" fill="#5A5550" text-anchor="middle">Ollama</text>

  <!-- Right stats box -->
  <rect x="716" y="28" width="258" height="134" rx="8" fill="#E2DDD7" stroke="#C4BAB2" stroke-width="1"/>

  <!-- Architecture label -->
  <text x="845" y="56" class="m" font-size="10" fill="#7A7470" text-anchor="middle">ARCHITECTURE</text>

  <!-- Stats -->
  <text x="845" y="82" class="s" font-size="15" font-weight="bold" fill="#4A4540" text-anchor="middle">6 services · ReAct agent</text>
  <text x="845" y="100" class="m" font-size="12" fill="#7A7470" text-anchor="middle">BM25 + vector + RRF</text>

  <!-- Separator -->
  <line x1="730" y1="116" x2="960" y2="116" stroke="#C4BAB2" stroke-width="1"/>

  <!-- GitHub link -->
  <text x="845" y="148" class="m" font-size="13" fill="#8EA8BC" text-anchor="middle">view on GitHub ↗</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="196" viewBox="0 0 1000 196">
<defs>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="100%" stop-color="#a371f7"/>
  </linearGradient>
  <style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>

<!-- Background -->
<rect width="1000" height="196" fill="#0a1424"/>

<!-- Card border glow -->
<rect x="6" y="6" width="988" height="184" rx="10" stroke="#00b7ff" stroke-opacity=".35" stroke-width="2" fill="none" filter="url(#glow)"/>
<rect x="6" y="6" width="988" height="184" rx="10" fill="#0a1424" stroke="#1f6feb" stroke-opacity=".75"/>

<!-- Left gradient accent bar -->
<rect x="6" y="6" width="6" height="184" rx="3" fill="url(#barGrad)"/>

<!-- Project number label -->
<text x="36" y="48" class="m" font-size="11" fill="#8b949e">01 / FEATURED PROJECT</text>

<!-- Project title -->
<text x="36" y="80" class="s" font-size="20" font-weight="700" fill="#e6edf3">researchmate</text>
<text x="222" y="80" class="s" font-size="20" font-weight="400" fill="#8b949e"> · Lab Experiment Tracking with LLM Agents</text>

<!-- Description -->
<text x="36" y="110" class="s" font-size="13" fill="#8b949e">LangChain ReAct agent with hybrid BM25 + pgvector retrieval and RRF fusion, across a 6-service Docker Compose</text>
<text x="36" y="128" class="s" font-size="13" fill="#8b949e">stack with local LLM inference via Ollama.</text>

<!-- Tech tags -->
<g transform="translate(36, 144)">
  <rect x="0" y="0" width="56" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="28" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">Python</text>

  <rect x="64" y="0" width="74" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="101" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">LangChain</text>

  <rect x="146" y="0" width="68" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="180" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">pgvector</text>

  <rect x="222" y="0" width="50" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="247" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">Flask</text>

  <rect x="280" y="0" width="54" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="307" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">Docker</text>

  <rect x="342" y="0" width="52" height="26" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".6"/>
  <text x="368" y="17.32" class="m" font-size="11" font-weight="500" fill="#c9d1d9" text-anchor="middle">Ollama</text>
</g>

<!-- Right stats box -->
<rect x="752" y="30" width="220" height="130" rx="8" fill="#0d1b30" stroke="#1f6feb" stroke-opacity=".4"/>
<text x="862" y="60" class="m" font-size="11" fill="#58a6ff" text-anchor="middle">ARCHITECTURE</text>
<line x1="770" y1="68" x2="954" y2="68" stroke="#1f6feb" stroke-opacity="0.2" stroke-width="1"/>
<text x="862" y="95" class="m" font-size="13" fill="#e6edf3" text-anchor="middle">6 services · ReAct agent</text>
<text x="862" y="118" class="m" font-size="13" fill="#e6edf3" text-anchor="middle">BM25 + vector + RRF</text>

<!-- GitHub link -->
<text x="862" y="148" class="m" font-size="11" fill="#58a6ff" text-anchor="middle">view on GitHub ↗</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60">
<defs>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="100%" stop-color="#a371f7"/>
  </linearGradient>
  <style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>

<!-- Background -->
<rect width="1000" height="60" fill="#0a1424"/>

<!-- Card border glow -->
<rect x="6" y="6" width="988" height="48" rx="10" stroke="#00b7ff" stroke-opacity=".35" stroke-width="2" fill="none" filter="url(#glow)"/>
<rect x="6" y="6" width="988" height="48" rx="10" fill="#0a1424" stroke="#1f6feb" stroke-opacity=".75"/>

<!-- Left gradient accent bar -->
<rect x="6" y="6" width="6" height="48" rx="3" fill="url(#barGrad)"/>

<!-- "Featured Projects" title -->
<text x="36" y="38" class="s" font-size="18" font-weight="700" fill="#e6edf3">Featured Projects</text>

<!-- Right monospace label -->
<text x="964" y="38" class="m" font-size="12" fill="#8b949e" text-anchor="end">PINNED</text>
</svg>

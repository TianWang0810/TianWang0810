<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');
      .s{font-family:'Caveat',cursive}
      .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    </style>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EA8BC"/>
      <stop offset="100%" stop-color="#ACA0BA"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="1000" height="56" fill="#EDE8E3"/>
  <rect x="6" y="6" width="988" height="44" rx="10" fill="none" stroke="#C4BAB2" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="6" y="6" width="3" height="44" fill="url(#accentGrad)"/>

  <!-- Featured Projects title -->
  <text x="36" y="38" class="s" font-size="20" font-weight="bold" fill="#4A4540">Featured Projects</text>

  <!-- Right PINNED label -->
  <text x="970" y="38" class="m" font-size="11" fill="#7A7470" text-anchor="end">PINNED</text>
</svg>

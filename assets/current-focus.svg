<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360">
  <defs>
    <style>
      .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
      .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    </style>
  </defs>

  <!-- Card background -->
  <rect width="680" height="360" fill="#EDE8E3"/>
  <rect x="6" y="6" width="668" height="348" rx="10" fill="none" stroke="#C4BAB2" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="6" y="6" width="668" height="30" rx="10" fill="#E2DDD7"/>
  <rect x="6" y="30" width="668" height="6" fill="#E2DDD7"/>
  <line x1="6" y1="36" x2="674" y2="36" stroke="#C4BAB2" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="28" cy="21" r="5" fill="#C49090"/>
  <circle cx="46" cy="21" r="5" fill="#C4B070"/>
  <circle cx="64" cy="21" r="5" fill="#8FA898"/>

  <!-- Terminal title -->
  <text x="340" y="26" class="m" font-size="12" fill="#7A7470" text-anchor="middle">tianwang@seattle: ~ — zsh</text>

  <!-- Line 1: whoami -->
  <text x="28" y="68" class="m" font-size="13" fill="#8FA898" font-weight="bold">$</text>
  <text x="42" y="68" class="m" font-size="13" fill="#4A4540" font-weight="bold">whoami</text>
  <text x="28" y="88" class="m" font-size="12" fill="#6A6460">MSCS @ Northeastern University, Seattle · Applied AI Researcher</text>

  <!-- Line 2: current_focus -->
  <text x="28" y="116" class="m" font-size="13" fill="#8FA898" font-weight="bold">$</text>
  <text x="42" y="116" class="m" font-size="13" fill="#4A4540" font-weight="bold">current_focus</text>

  <text x="28" y="136" class="m" font-size="12" fill="#8EA8BC">&gt;</text>
  <text x="42" y="136" class="m" font-size="12" fill="#6A6460">Building LLM agents and RAG pipelines end-to-end</text>

  <text x="28" y="156" class="m" font-size="12" fill="#8EA8BC">&gt;</text>
  <text x="42" y="156" class="m" font-size="12" fill="#6A6460">Designing distributed event-driven backends</text>

  <text x="28" y="176" class="m" font-size="12" fill="#8EA8BC">&gt;</text>
  <text x="42" y="176" class="m" font-size="12" fill="#6A6460">Working on AI infrastructure and multi-service orchestration</text>

  <text x="28" y="196" class="m" font-size="12" fill="#8EA8BC">&gt;</text>
  <text x="42" y="196" class="m" font-size="12" fill="#6A6460">Learning Rust and high-performance systems</text>

  <text x="28" y="216" class="m" font-size="12" fill="#8EA8BC">&gt;</text>
  <text x="42" y="216" class="m" font-size="12" fill="#6A6460">Preparing for 2026 Summer Internships</text>

  <!-- Line 3: stack -->
  <text x="28" y="248" class="m" font-size="13" fill="#8FA898" font-weight="bold">$</text>
  <text x="42" y="248" class="m" font-size="13" fill="#4A4540" font-weight="bold">stack</text>
  <text x="28" y="268" class="m" font-size="12" fill="#6A6460">Python / Java / TypeScript / Go / Rust / Kotlin / AWS</text>

  <!-- Final prompt line with blinking cursor -->
  <text x="28" y="308" class="m" font-size="13" fill="#8FA898" font-weight="bold">$</text>
  <rect x="46" y="295" width="8" height="15" fill="#4A4540">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>

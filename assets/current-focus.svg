<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360">
<defs>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  </style>
</defs>

<!-- Background -->
<rect width="680" height="360" fill="#0a1424"/>

<!-- Card border glow -->
<rect x="6" y="6" width="668" height="348" rx="10" stroke="#00b7ff" stroke-opacity=".35" stroke-width="2" fill="none" filter="url(#glow)"/>
<rect x="6" y="6" width="668" height="348" rx="10" fill="#0a1424" stroke="#1f6feb" stroke-opacity=".75"/>

<!-- Terminal title bar -->
<rect x="6" y="6" width="668" height="36" rx="10" fill="#0d1b30"/>
<rect x="6" y="30" width="668" height="12" fill="#0d1b30"/>
<rect x="6" y="6" width="668" height="36" fill="none" stroke="#1f6feb" stroke-opacity=".3"/>

<!-- Window buttons -->
<circle cx="30" cy="24" r="6" fill="#f85149"/>
<circle cx="50" cy="24" r="6" fill="#d29922"/>
<circle cx="70" cy="24" r="6" fill="#3fb950"/>

<!-- Window title -->
<text x="340" y="29" class="s" font-size="12" fill="#8b949e" text-anchor="middle">tianwang@seattle: ~ — zsh</text>

<!-- Terminal content -->
<!-- whoami -->
<text x="32" y="72" class="m" font-size="13" fill="#3fb950">$</text>
<text x="46" y="72" class="m" font-size="13" fill="#c9d1d9">whoami</text>
<text x="32" y="92" class="m" font-size="12" fill="#e6edf3">MSCS @ Northeastern University, Seattle · Applied AI Researcher</text>

<!-- current_focus -->
<text x="32" y="118" class="m" font-size="13" fill="#3fb950">$</text>
<text x="46" y="118" class="m" font-size="13" fill="#c9d1d9">current_focus</text>

<text x="32" y="139" class="m" font-size="12" fill="#58a6ff">›</text>
<text x="50" y="139" class="m" font-size="12" fill="#c9d1d9">Building LLM agents and RAG pipelines end-to-end</text>

<text x="32" y="158" class="m" font-size="12" fill="#58a6ff">›</text>
<text x="50" y="158" class="m" font-size="12" fill="#c9d1d9">Designing distributed event-driven backends</text>

<text x="32" y="177" class="m" font-size="12" fill="#58a6ff">›</text>
<text x="50" y="177" class="m" font-size="12" fill="#c9d1d9">Working on AI infrastructure and multi-service orchestration</text>

<text x="32" y="196" class="m" font-size="12" fill="#58a6ff">›</text>
<text x="50" y="196" class="m" font-size="12" fill="#c9d1d9">Learning Rust and high-performance systems</text>

<text x="32" y="215" class="m" font-size="12" fill="#58a6ff">›</text>
<text x="50" y="215" class="m" font-size="12" fill="#c9d1d9">Preparing for 2026 Summer Internships</text>

<!-- stack -->
<text x="32" y="241" class="m" font-size="13" fill="#3fb950">$</text>
<text x="46" y="241" class="m" font-size="13" fill="#c9d1d9">stack</text>
<text x="32" y="261" class="m" font-size="12" fill="#a371f7">Python</text>
<text x="96" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="114" y="261" class="m" font-size="12" fill="#a371f7">Java</text>
<text x="148" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="166" y="261" class="m" font-size="12" fill="#a371f7">TypeScript</text>
<text x="250" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="268" y="261" class="m" font-size="12" fill="#a371f7">Go</text>
<text x="288" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="306" y="261" class="m" font-size="12" fill="#a371f7">Rust</text>
<text x="342" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="360" y="261" class="m" font-size="12" fill="#a371f7">Kotlin</text>
<text x="408" y="261" class="m" font-size="12" fill="#8b949e"> / </text>
<text x="426" y="261" class="m" font-size="12" fill="#a371f7">AWS</text>

<!-- prompt line with blinking cursor -->
<text x="32" y="295" class="m" font-size="13" fill="#3fb950">$</text>
<text x="46" y="295" class="m" font-size="13" fill="#c9d1d9"> </text>
<rect x="53" y="282" width="9" height="15" fill="#c9d1d9">
  <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
</rect>

<!-- Bottom status line -->
<rect x="6" y="330" width="668" height="24" rx="0" fill="#0d1b30" fill-opacity="0.7"/>
<rect x="6" y="330" width="668" height="24" rx="0" fill="none" stroke="#1f6feb" stroke-opacity=".2"/>
<text x="20" y="346" class="m" font-size="11" fill="#3fb950">●</text>
<text x="32" y="346" class="m" font-size="11" fill="#8b949e"> zsh · UTF-8 · Seattle, WA</text>
</svg>

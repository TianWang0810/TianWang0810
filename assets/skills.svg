<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" viewBox="0 0 500 310">
  <defs>
    <style>
      .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
      .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    </style>
  </defs>

  <!-- Card background -->
  <rect width="500" height="310" fill="#EDE8E3"/>
  <rect x="6" y="6" width="488" height="298" rx="10" fill="none" stroke="#C4BAB2" stroke-width="1.5"/>

  <!-- Title -->
  <text x="28" y="42" class="s" font-size="16" font-weight="bold" fill="#4A4540">Tech Stack &amp; Skills</text>
  <line x1="6" y1="52" x2="494" y2="52" stroke="#C4BAB2" stroke-width="1"/>

  <!-- LANGUAGES section: dot/label at y=74, items at y=93 -->
  <circle cx="28" cy="74" r="4" fill="#8EA8BC"/>
  <text x="42" y="79" class="m" font-size="11" font-weight="bold" fill="#8EA8BC">LANGUAGES</text>
  <text x="28" y="97" class="m" font-size="11.5" fill="#6A6460">Python · Java · TypeScript · Go · Rust · Kotlin · SQL</text>
  <line x1="6" y1="108" x2="494" y2="108" stroke="#C4BAB2" stroke-width="0.8"/>

  <!-- AI / ML section: dot/label at y=124, items at y=143 -->
  <circle cx="28" cy="124" r="4" fill="#8EA8BC"/>
  <text x="42" y="129" class="m" font-size="11" font-weight="bold" fill="#8EA8BC">AI / ML</text>
  <text x="28" y="147" class="m" font-size="11.5" fill="#6A6460">LangChain · RAG · pgvector · Ollama · PyTorch · HuggingFace</text>
  <line x1="6" y1="158" x2="494" y2="158" stroke="#C4BAB2" stroke-width="0.8"/>

  <!-- BACKEND / SYSTEMS section: dot/label at y=174, items at y=193 -->
  <circle cx="28" cy="174" r="4" fill="#8EA8BC"/>
  <text x="42" y="179" class="m" font-size="11" font-weight="bold" fill="#8EA8BC">BACKEND / SYSTEMS</text>
  <text x="28" y="197" class="m" font-size="11.5" fill="#6A6460">Flask · FastAPI · PostgreSQL · Redis · Docker · Kafka</text>
  <text x="28" y="212" class="m" font-size="11.5" fill="#6A6460">gRPC · REST · Microservices · Event-driven Architecture</text>
  <line x1="6" y1="224" x2="494" y2="224" stroke="#C4BAB2" stroke-width="0.8"/>

  <!-- CLOUD / DEVOPS section: dot/label at y=236, items at y=255 -->
  <circle cx="28" cy="236" r="4" fill="#8EA8BC"/>
  <text x="42" y="241" class="m" font-size="11" font-weight="bold" fill="#8EA8BC">CLOUD / DEVOPS</text>
  <text x="28" y="259" class="m" font-size="11.5" fill="#6A6460">AWS · GCP · Docker Compose · GitHub Actions · Linux</text>

  <!-- Bottom always learning -->
  <text x="472" y="298" class="m" font-size="10" fill="#8FA898" text-anchor="end">● always learning</text>
</svg>
